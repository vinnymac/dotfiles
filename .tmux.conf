# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use Vim shortcuts
setw -g mode-keys vi

# Make `Ctrl+A R` reload the config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Resize window to match the most recently attached client
set -g window-size latest

# Scrollback history
set-option -g history-limit 100000

# Mouse support: scroll, select/resize panes, drag-select for copy
set -g mouse on

# True color, needed for Claude Code and other rich TUIs to render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:Ms=\\E]52;c;%p2%s\\007"

# Low escape-time so Escape/Alt key sequences register instantly in vim,
# Claude Code, and other TUIs (tmux's old default of 500ms feels laggy)
set -sg escape-time 10

# Let apps inside tmux (vim, Claude Code) see pane focus changes
set -g focus-events on

# Copy-mode selections and mouse drag-select go to the system clipboard,
# not just tmux's internal buffer. set-clipboard on also lets apps inside
# tmux (e.g. nvim) reach the system clipboard via OSC 52 passthrough.
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
